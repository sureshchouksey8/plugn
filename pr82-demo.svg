<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">PR 82 demo for plugn bounty 59</title>
  <desc id="desc">Animated summary of PR 82 changes and verification.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .bg { fill: #0f172a; }
    .bar { fill: #111827; }
    .teal { fill: #14b8a6; }
    .amber { fill: #f59e0b; }
    .title { fill: #f8fafc; font-size: 48px; font-weight: 700; }
    .sub { fill: #67e8f9; font-size: 28px; }
    .body { fill: #e5e7eb; font-size: 27px; }
    .small { fill: #cbd5e1; font-size: 22px; }
    .code { fill: #86efac; font-size: 24px; font-family: 'Courier New', monospace; }
    .card { fill: #020617; stroke: #334155; stroke-width: 2; }
    .slide { opacity: 0; animation: show 20s infinite; }
    .s1 { animation-delay: 0s; }
    .s2 { animation-delay: 4s; }
    .s3 { animation-delay: 8s; }
    .s4 { animation-delay: 12s; }
    .s5 { animation-delay: 16s; }
    @keyframes show {
      0% { opacity: 0; }
      3% { opacity: 1; }
      18% { opacity: 1; }
      23% { opacity: 0; }
      100% { opacity: 0; }
    }
  </style>
  <rect class="bg" width="1280" height="720" />
  <rect class="bar" width="1280" height="88" />
  <rect class="bar" y="650" width="1280" height="70" />
  <rect class="teal" x="0" y="88" width="18" height="562" />
  <rect class="amber" x="18" y="88" width="10" height="562" />
  <text x="64" y="54" class="small">plugn bounty #59 demo</text>

  <g class="slide s1">
    <text x="72" y="155" class="title">PR #82: Stabilize local and production readiness</text>
    <text x="74" y="212" class="sub">BAWES-Universe/plugn bounty #59</text>
    <circle cx="90" cy="278" r="7" class="amber" /><text x="112" y="286" class="body">Visible Algora claim: #82</text>
    <circle cx="90" cy="330" r="7" class="amber" /><text x="112" y="338" class="body">Open, mergeable, CodeRabbit status passing</text>
    <circle cx="90" cy="382" r="7" class="amber" /><text x="112" y="390" class="body">17 changed files covering local startup and production safety</text>
    <text x="72" y="684" class="small">Short demo of the submitted changes and verification.</text>
  </g>

  <g class="slide s2">
    <text x="72" y="155" class="title">Local Docker startup path</text>
    <text x="74" y="212" class="sub">docker-compose-local.yml, README, run-tests.sh</text>
    <circle cx="90" cy="278" r="7" class="amber" /><text x="112" y="286" class="body">Fixes PhpMyAdmin/vendor-dashboard port collision</text>
    <circle cx="90" cy="330" r="7" class="amber" /><text x="112" y="338" class="body">Adds MySQL and Redis healthchecks before app startup</text>
    <circle cx="90" cy="382" r="7" class="amber" /><text x="112" y="390" class="body">Binds local published service ports to 127.0.0.1</text>
    <circle cx="90" cy="434" r="7" class="amber" /><text x="112" y="442" class="body">Aligns docs and test runner with docker compose -f docker-compose-local.yml</text>
    <rect x="72" y="540" width="1136" height="78" rx="14" class="card" />
    <text x="98" y="588" class="code">yaml ok; loopback ports ok; no duplicate host ports</text>
  </g>

  <g class="slide s3">
    <text x="72" y="155" class="title">Production cookie/session readiness</text>
    <text x="74" y="212" class="sub">environments/prod/*/config/main-local.php</text>
    <circle cx="90" cy="278" r="7" class="amber" /><text x="112" y="286" class="body">Moves hardcoded Yii cookieValidationKey values to env variables</text>
    <circle cx="90" cy="330" r="7" class="amber" /><text x="112" y="338" class="body">Adds app-specific env names with PLUGN_COOKIE_VALIDATION_KEY fallback</text>
    <circle cx="90" cy="382" r="7" class="amber" /><text x="112" y="390" class="body">Fixes the empty remail production cookie key path</text>
    <circle cx="90" cy="434" r="7" class="amber" /><text x="112" y="442" class="body">Adds a guard script to prevent hardcoded or empty keys from returning</text>
    <rect x="72" y="540" width="1136" height="78" rx="14" class="card" />
    <text x="98" y="588" class="code">bash tests/check-prod-cookie-validation-env.sh  # passed</text>
  </g>

  <g class="slide s4">
    <text x="72" y="155" class="title">Production debug mode disabled</text>
    <text x="74" y="212" class="sub">prod, prod-docker, and prod-railway API front controllers</text>
    <circle cx="90" cy="278" r="7" class="amber" /><text x="112" y="286" class="body">Changes YII_DEBUG from true to false in production API entrypoints</text>
    <circle cx="90" cy="330" r="7" class="amber" /><text x="112" y="338" class="body">Keeps YII_ENV set to prod</text>
    <circle cx="90" cy="382" r="7" class="amber" /><text x="112" y="390" class="body">Adds a guard script so debug mode cannot silently regress</text>
    <rect x="72" y="540" width="1136" height="78" rx="14" class="card" />
    <text x="98" y="588" class="code">bash tests/check-prod-api-debug-disabled.sh  # passed</text>
  </g>

  <g class="slide s5">
    <text x="72" y="155" class="title">Verification summary</text>
    <text x="74" y="212" class="sub">Local environment results</text>
    <circle cx="90" cy="278" r="7" class="amber" /><text x="112" y="286" class="body">Compose port/loopback sanity check passed</text>
    <circle cx="90" cy="330" r="7" class="amber" /><text x="112" y="338" class="body">Production cookie-key guard passed; PHP lint auto-runs where PHP exists</text>
    <circle cx="90" cy="382" r="7" class="amber" /><text x="112" y="390" class="body">Production API debug guard passed</text>
    <circle cx="90" cy="434" r="7" class="amber" /><text x="112" y="442" class="body">Shell syntax checks and git diff whitespace checks passed</text>
    <text x="72" y="684" class="small">Docker is not installed in this environment, so the full compose stack was not run locally.</text>
  </g>
</svg>
